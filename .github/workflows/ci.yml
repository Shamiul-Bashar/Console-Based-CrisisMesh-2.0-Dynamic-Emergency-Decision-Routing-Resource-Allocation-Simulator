name: C++ Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows build and tests
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure with short build path
        shell: pwsh
        run: cmake -S "$env:GITHUB_WORKSPACE" -B C:/b -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build C:/b --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir C:/b --output-on-failure
